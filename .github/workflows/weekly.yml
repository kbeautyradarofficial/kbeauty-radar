name: weekly-newsletter

on:
  schedule:
    - cron: "0 23 * * 0"   # 매주 월요일 08:00 KST (UTC 일요일 23:00)
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run | draft | auto"
        default: "dry-run"

permissions:
  contents: write

concurrency: kbr

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run weekly newsletter
        run: python weekly.py
        env:
          PUBLISH_MODE: ${{ inputs.mode || vars.PUBLISH_MODE || 'draft' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
          KIT_TAG_KO: ${{ vars.KIT_TAG_KO }}
          KIT_TAG_EN: ${{ vars.KIT_TAG_EN }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
      - name: Save archive
        if: always()
        run: |
          git config user.name "kbr-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output || true
          git diff --cached --quiet || (git commit -m "weekly $(date +%F)" && git push)
