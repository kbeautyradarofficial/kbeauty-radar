name: check-subscription

# Max 구독 토큰(CLAUDE_CODE_OAUTH_TOKEN)으로 Claude Code가 로그인되는지만 확인 (API 크레딧 사용 안 함)
on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Ask Claude for a one-word reply via subscription
        env:
          RAW_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          echo "token length (after removing whitespace): $(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]' | wc -c)"
          export CLAUDE_CODE_OAUTH_TOKEN="$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]')"
          unset ANTHROPIC_API_KEY
          claude --version
          claude -p "Reply with exactly: OK" --model claude-opus-5-5 --output-format json | head -c 600
