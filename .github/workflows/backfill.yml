name: backfill-archive

on:
  workflow_dispatch:
    inputs:
      count:
        description: "how many archive posts to create"
        default: "20"

permissions:
  contents: write

concurrency: kbr

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Install card renderer (Chromium + Korean fonts)
        run: |
          python -m playwright install --with-deps chromium
          sudo apt-get install -y -q fonts-noto-cjk
      - name: Build archive queue
        run: python backfill.py ${{ inputs.count }}
        env:
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
      - name: Save
        if: always()
        run: |
          git config user.name "kbr-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "backfill $(date +%F)" && git pull --rebase && git push)
