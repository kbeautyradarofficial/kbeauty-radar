name: build-series

on:
  workflow_dispatch:
    inputs:
      count:
        description: "how many series reports to create (empty = all remaining topics)"
        default: ""

permissions:
  contents: write

concurrency: kbr

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Install Claude Code CLI (Max subscription path)
        run: npm install -g @anthropic-ai/claude-code
      - name: Install card renderer (Chromium + Korean fonts)
        run: |
          python -m playwright install --with-deps chromium
          sudo apt-get install -y -q fonts-noto-cjk
      - name: Build current-insight series queue
        run: python series.py ${{ inputs.count }}
        env:
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      - name: Save
        if: always()
        run: |
          git config user.name "kbr-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "series $(date +%F)" && git pull --rebase && git push)
